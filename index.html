<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Mining Explorer</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: Arial, sans-serif;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #ui {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            user-select: none;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            pointer-events: none;
        }
        #inventory {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 5px;
            max-height: 80vh;
            overflow-y: auto;
            user-select: none;
        }
        .inventory-section {
            margin-bottom: 15px;
        }
        .inventory-title {
            font-weight: bold;
            margin-bottom: 5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }
        .inventory-item {
            display: flex;
            justify-content: space-between;
            margin: 2px 0;
        }
        #instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            border-radius: 5px;
            text-align: center;
            z-index: 10;
        }
        #smeltingMenu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px;
            border-radius: 5px;
            z-index: 10;
            display: none;
            max-height: 80vh;
            overflow-y: auto;
            width: 300px;
        }
        .smelt-button {
            background: #4a4a4a;
            border: none;
            color: white;
            padding: 5px 10px;
            margin: 5px 0;
            border-radius: 3px;
            cursor: pointer;
        }
        .smelt-button:hover {
            background: #5a5a5a;
        }
        .smelt-button:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <svg id="crosshair" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="48" stroke="white" stroke-width="2" fill="none" opacity="0.7" />
            <line x1="50" y1="0" x2="50" y2="100" stroke="white" stroke-width="2" opacity="0.7" />
            <line x1="0" y1="50" x2="100" y2="50" stroke="white" stroke-width="2" opacity="0.7" />
        </svg>
        
        <div id="ui">
            <div>Block: <span id="blockInfo">None</span></div>
            <div>Position: <span id="positionInfo">0, 0, 0</span></div>
            <div id="miningProgress"></div>
        </div>
        
        <div id="inventory">
            <h3>Inventory</h3>
            <div class="inventory-section">
                <div class="inventory-title">Ores</div>
                <div id="oreInventory"></div>
            </div>
            <div class="inventory-section">
                <div class="inventory-title">Bars</div>
                <div id="barInventory"></div>
            </div>
            <button id="smeltButton" class="smelt-button">Open Smelting</button>
        </div>
        
        <div id="instructions">
            <h2>3D Mining Explorer</h2>
            <p>Click to start exploring and mining</p>
            <p>WASD to move, Mouse to look around</p>
            <p>E to jump, Q to open/close inventory</p>
            <p>Left click and hold to mine blocks</p>
            <p>Press ESC to release mouse control</p>
        </div>
        
        <div id="smeltingMenu">
            <h3>Smelting</h3>
            <div id="smeltingOptions"></div>
            <button id="closeSmeltingButton" class="smelt-button">Close</button>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/"
            }
        }
    </script>
    <script type="module" src="js/main.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
